[build]
builder = "nixpacks"

[deploy]
startCommand = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/"
healthcheckTimeout = 100

[[services]]
name = "pos-backend"
sourceDir = "backend"
dockerfile = "Dockerfile"
healthcheckPath = "/"
healthcheckTimeout = 100
autoDeploy = true

[[services]]
name = "pos-frontend"
sourceDir = "frontend"
dockerfile = "Dockerfile"
healthcheckPath = "/"
healthcheckTimeout = 100
autoDeploy = true

[[services.postgres]]
name = "pos-db"
plan = "starter-hobby"